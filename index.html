<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/rv-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta name="description" content="Rishi Vinod’s personal portfolio. Explore selected projects, learn about me, and get in touch." />
    <title>Rishi Vinod | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.body.style.cssText = 'margin:0;background:#101010;color:#f1ede4;font-family:Arial,sans-serif;line-height:1.6';
        document.getElementById('root').innerHTML = `
          <main style="max-width:560px;margin:12vh auto;padding:24px">
            <h1 style="line-height:1.2">Open your portfolio through the local server<span style="color:#ff6500">.</span></h1>
            <p>This React project needs a development server. Opening the HTML file directly cannot load the portfolio.</p>
            <p>Run <code>bun run dev</code> from the personal-portfolio folder, then open the Local address printed in your terminal.</p>
            <a href="http://127.0.0.1:5173/" style="display:inline-block;margin-top:16px;padding:12px 20px;background:#f1ede4;color:#101010;text-decoration:none">Open local portfolio ↗</a>
          </main>`;
      }
    </script>
    <noscript>This portfolio needs JavaScript. Enable JavaScript and open the site through its local server.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
